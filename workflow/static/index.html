<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OCR Maths — Révision</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #0e0f11;
  --surface:  #16181c;
  --card:     #1c1f26;
  --border:   #2a2d36;
  --text:     #e8eaf0;
  --muted:    #707484;
  --green:    #2dd4a4;
  --amber:    #f4a44a;
  --red:      #e05f5f;
  --blue:     #5b9cf6;
  --purple:   #a78bfa;
  --radius:   10px;
  --mono:     'IBM Plex Mono', monospace;
  --sans:     'Syne', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }

/* ── Layout ── */
#app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; }
#topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px; border-bottom: 1px solid var(--border);
  background: var(--surface);
}
#topbar h1 { font-size: 15px; font-weight: 700; letter-spacing: .03em; color: var(--text); }
#topbar .sep { width: 1px; height: 20px; background: var(--border); }
#status-badge {
  font-family: var(--mono); font-size: 11px; padding: 3px 10px;
  border-radius: 99px; background: var(--border); color: var(--muted);
}
#status-badge.processing { background: #1a2740; color: var(--blue); }
#status-badge.review     { background: #2a1e10; color: var(--amber); }
#status-badge.done       { background: #0f2620; color: var(--green); }
#status-badge.error      { background: #2a1010; color: var(--red); }
.spacer { flex: 1; }
#progress-bar-wrap { width: 160px; height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
#progress-bar { height: 100%; width: 0%; background: var(--blue); border-radius: 99px; transition: width .4s; }

#main { display: grid; grid-template-columns: 380px 1fr; height: 100%; overflow: hidden; }

/* ── Upload Panel ── */
#upload-panel {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  grid-column: 1 / -1; gap: 20px; padding: 40px;
}
#drop-zone {
  width: 480px; border: 2px dashed var(--border); border-radius: 16px;
  padding: 48px 32px; text-align: center; cursor: pointer; transition: border-color .2s;
}
#drop-zone:hover, #drop-zone.dragover { border-color: var(--blue); }
#drop-zone svg { margin-bottom: 12px; opacity: .5; }
#drop-zone p { color: var(--muted); line-height: 1.8; }
#drop-zone strong { color: var(--text); }
#file-input { display: none; }
.config-row { display: flex; gap: 16px; width: 480px; }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.field input[type=range] { accent-color: var(--blue); }
.field .val { font-family: var(--mono); font-size: 12px; color: var(--blue); }
#btn-start {
  width: 480px; padding: 14px; border: none; border-radius: var(--radius);
  background: var(--blue); color: #fff; font-family: var(--sans); font-size: 14px;
  font-weight: 600; cursor: pointer; transition: opacity .2s;
}
#btn-start:disabled { opacity: .4; cursor: not-allowed; }
#btn-start:hover:not(:disabled) { opacity: .85; }

/* ── Left column : file queue + stats ── */
#left-col {
  display: flex; flex-direction: column; border-right: 1px solid var(--border);
  overflow: hidden;
}
#queue-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
#queue-header h2 { font-size: 13px; font-weight: 600; color: var(--text); }
#block-list { flex: 1; overflow-y: auto; padding: 8px; }
.block-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius); cursor: pointer;
  transition: background .15s; border: 1px solid transparent;
}
.block-item:hover { background: var(--card); }
.block-item.active { background: var(--card); border-color: var(--blue); }
.block-item.corrected { border-color: var(--green); }
.block-badge {
  font-family: var(--mono); font-size: 9px; padding: 2px 7px; border-radius: 4px;
  font-weight: 500; white-space: nowrap;
}
.badge-formula { background: #22143a; color: var(--purple); }
.badge-text    { background: #132030; color: var(--blue); }
.badge-table   { background: #1a2210; color: var(--green); }
.conf-bar { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.conf-bar-fill { height: 100%; border-radius: 2px; transition: width .3s; }
.conf-high   { background: var(--green); }
.conf-medium { background: var(--amber); }
.conf-low    { background: var(--red); }
.flag-icon { color: var(--amber); font-size: 12px; }
.ok-icon   { color: var(--green); font-size: 12px; }
.block-id  { font-family: var(--mono); font-size: 10px; color: var(--muted); min-width: 80px; }

#stats-panel { padding: 16px 20px; border-top: 1px solid var(--border); background: var(--surface); }
#stats-panel h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-box { background: var(--card); border-radius: 8px; padding: 10px 12px; }
.stat-num { font-family: var(--mono); font-size: 20px; font-weight: 500; }
.stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }
.green { color: var(--green); } .amber { color: var(--amber); }
.blue  { color: var(--blue); }  .red   { color: var(--red); }

/* ── Right column : review editor ── */
#right-col { display: flex; flex-direction: column; overflow: hidden; }
#editor-header {
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
#editor-header h2 { font-size: 13px; font-weight: 600; }
#block-type-tag {
  font-family: var(--mono); font-size: 10px; padding: 3px 10px; border-radius: 99px;
  background: var(--border); color: var(--muted);
}
#conf-display { font-family: var(--mono); font-size: 12px; margin-left: auto; }

#editor-body { flex: 1; display: grid; grid-template-rows: 1fr 1fr; overflow: hidden; }
#img-panel { padding: 16px 20px; border-bottom: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
#img-panel h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
#block-image-wrap { flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--card); border-radius: var(--radius); }
#block-image { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }

#text-panel { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.ocr-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 0 0 auto; }
.ocr-box { background: var(--card); border-radius: var(--radius); padding: 10px 12px; border: 1px solid var(--border); }
.ocr-box h4 { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.ocr-box pre { font-family: var(--mono); font-size: 11px; color: var(--text); white-space: pre-wrap; word-break: break-all; max-height: 70px; overflow-y: auto; opacity: .8; }
#correction-area-wrap { flex: 1; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
#correction-area-wrap label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
#correction-area {
  flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); font-family: var(--mono); font-size: 13px; padding: 12px;
  resize: none; outline: none; transition: border-color .2s; min-height: 0;
}
#correction-area:focus { border-color: var(--blue); }

#editor-footer {
  padding: 12px 20px; border-top: 1px solid var(--border);
  display: flex; gap: 10px; align-items: center; background: var(--surface);
}
.btn {
  padding: 9px 20px; border: none; border-radius: var(--radius); font-family: var(--sans);
  font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .2s;
}
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-primary  { background: var(--blue);  color: #fff; }
.btn-accept   { background: var(--green); color: #0a1a14; }
.btn-skip     { background: var(--card);  color: var(--muted); border: 1px solid var(--border); }
.btn:hover:not(:disabled) { opacity: .8; }
#nav-counter { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: auto; }

/* ── Export bar ── */
#export-bar {
  display: none; padding: 10px 24px; background: var(--surface);
  border-top: 1px solid var(--border); align-items: center; gap: 12px;
  font-size: 12px; color: var(--muted);
}
#export-bar.visible { display: flex; }
.btn-export { padding: 7px 16px; font-size: 12px; }
.btn-json     { background: #132030; color: var(--blue);   border: 1px solid var(--blue);   border-radius: var(--radius); cursor:pointer; font-family:var(--sans); font-weight:600; }
.btn-md       { background: #1a2210; color: var(--green);  border: 1px solid var(--green);  border-radius: var(--radius); cursor:pointer; font-family:var(--sans); font-weight:600; }
.btn-latex    { background: #22143a; color: var(--purple); border: 1px solid var(--purple); border-radius: var(--radius); cursor:pointer; font-family:var(--sans); font-weight:600; }
.btn-export:hover { opacity:.8; }

/* ── Spinner ── */
#spinner { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; grid-column: 1/-1; }
#spinner.visible { display: flex; }
.spin-ring {
  width: 48px; height: 48px; border: 3px solid var(--border);
  border-top-color: var(--blue); border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#spinner p { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* ── Empty state ── */
#empty-state { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="app">

  <!-- TOPBAR -->
  <div id="topbar">
    <h1>OCR Maths ✦</h1>
    <div class="sep"></div>
    <span id="status-badge">en attente</span>
    <div class="spacer"></div>
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  </div>

  <!-- MAIN -->
  <div id="main">

    <!-- UPLOAD PANEL -->
    <div id="upload-panel">
      <div id="drop-zone" onclick="document.getElementById('file-input').click()"
           ondragover="event.preventDefault();this.classList.add('dragover')"
           ondragleave="this.classList.remove('dragover')"
           ondrop="handleDrop(event)">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <polyline points="9 15 12 12 15 15"/>
        </svg>
        <p><strong>Déposer un PDF scanné</strong><br>ou cliquer pour parcourir<br><small>résolution recommandée ≥ 300 dpi</small></p>
      </div>
      <input type="file" id="file-input" accept=".pdf" onchange="handleFileSelect(this.files[0])"/>

      <div class="config-row">
        <div class="field">
          <label>Seuil de confiance</label>
          <input type="range" min="0.5" max="0.99" step="0.01" value="0.85"
                 oninput="document.getElementById('thresh-val').textContent=parseFloat(this.value).toFixed(2)"/>
          <span class="val" id="thresh-val">0.85</span>
        </div>
        <div class="field">
          <label>Résolution DPI</label>
          <input type="range" min="150" max="600" step="50" value="300"
                 oninput="document.getElementById('dpi-val').textContent=this.value"/>
          <span class="val" id="dpi-val">300</span>
        </div>
      </div>

      <button class="btn btn-primary" id="btn-start" disabled onclick="startProcessing()">
        Lancer le pipeline OCR
      </button>
    </div>

    <!-- SPINNER -->
    <div id="spinner">
      <div class="spin-ring"></div>
      <p id="spinner-msg">Prétraitement image...</p>
    </div>

    <!-- LEFT COL -->
    <div id="left-col" style="display:none">
      <div class="queue-header" style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
        <h2 style="font-size:13px;font-weight:600">Blocs détectés</h2>
        <span id="flag-count" style="font-family:var(--mono);font-size:11px;color:var(--amber)"></span>
      </div>
      <div id="block-list"></div>
      <div id="stats-panel">
        <h3>Métriques</h3>
        <div class="stats-grid" id="stats-grid"></div>
      </div>
    </div>

    <!-- RIGHT COL -->
    <div id="right-col" style="display:none">
      <div id="editor-header">
        <h2>Révision du bloc</h2>
        <span id="block-type-tag">—</span>
        <span id="conf-display" style="color:var(--muted)">—</span>
      </div>
      <div id="editor-body">
        <div id="img-panel">
          <h3>Image originale</h3>
          <div id="block-image-wrap">
            <img id="block-image" src="" alt="bloc"/>
          </div>
        </div>
        <div id="text-panel">
          <div class="ocr-compare">
            <div class="ocr-box">
              <h4>Mistral Document AI</h4>
              <pre id="mistral-out">—</pre>
            </div>
            <div class="ocr-box">
              <h4>Mathpix</h4>
              <pre id="mathpix-out">—</pre>
            </div>
          </div>
          <div id="correction-area-wrap">
            <label>Correction / Validation</label>
            <textarea id="correction-area" spellcheck="false"
              placeholder="LaTeX ou texte brut...&#10;Ex: \frac{1}{2} x^2 + 3x - 1"></textarea>
          </div>
        </div>
      </div>
      <div id="editor-footer">
        <button class="btn btn-accept" id="btn-accept" onclick="submitCorrection()">✓ Valider</button>
        <button class="btn btn-primary" id="btn-accept-merged" onclick="acceptMerged()">Accepter fusion</button>
        <button class="btn btn-skip" onclick="skipBlock()">Passer →</button>
        <span id="nav-counter">0 / 0</span>
      </div>
    </div>

  </div><!-- /main -->

  <!-- EXPORT BAR -->
  <div id="export-bar">
    <span>Export :</span>
    <button class="btn-export btn-json"  onclick="downloadExport('json')">JSON</button>
    <button class="btn-export btn-md"    onclick="downloadExport('markdown')">Markdown</button>
    <button class="btn-export btn-latex" onclick="downloadExport('latex')">LaTeX</button>
    <div style="flex:1"></div>
    <span id="done-msg" style="color:var(--green);font-family:var(--mono);font-size:11px"></span>
  </div>

</div><!-- /app -->

<script>
const API = '';   // même domaine; ou mettre 'http://localhost:8000' en dev cross-origin

let selectedFile = null;
let sessionId    = null;
let allBlocks    = [];
let reviewQueue  = [];
let reviewIdx    = 0;
let pollTimer    = null;

// ── Fichier sélectionné ─────────────────────────────────────────────────────
function handleFileSelect(file) {
  if (!file) return;
  selectedFile = file;
  document.getElementById('btn-start').disabled = false;
  document.querySelector('#drop-zone p').innerHTML =
    `<strong>${file.name}</strong><br>${(file.size/1024).toFixed(0)} Ko`;
}
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file?.name.endsWith('.pdf')) handleFileSelect(file);
}

// ── Lancer le pipeline ───────────────────────────────────────────────────────
async function startProcessing() {
  if (!selectedFile) return;
  const threshold = parseFloat(document.querySelector('input[type=range]').value);
  const dpi = parseInt(document.querySelectorAll('input[type=range]')[1].value);

  const fd = new FormData();
  fd.append('file', selectedFile);
  fd.append('threshold', threshold);
  fd.append('dpi', dpi);

  showPanel('spinner');
  setStatus('processing');

  try {
    const r = await fetch(`${API}/upload`, { method: 'POST', body: fd });
    const data = await r.json();
    sessionId = data.session_id;
    startPolling();
  } catch(e) {
    showError('Erreur upload : ' + e.message);
  }
}

// ── Polling statut ───────────────────────────────────────────────────────────
function startPolling() {
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch(`${API}/session/${sessionId}`);
      const data = await r.json();
      updateProgress(data.progress);

      const msgs = ['Prétraitement image...','OCR Mistral en cours...','OCR Mathpix en cours...','Fusion par consensus...','Finalisation...'];
      document.getElementById('spinner-msg').textContent = msgs[Math.floor((data.progress||0)/22)] || 'Traitement...';

      if (data.status === 'review' || data.status === 'done') {
        clearInterval(pollTimer);
        if (data.stats) renderStats(data.stats);
        await loadReviewQueue();
      }
      if (data.status === 'error') {
        clearInterval(pollTimer);
        showError(data.error);
      }
    } catch(e) { /* ignore network blip */ }
  }, 1200);
}

// ── Charger la file de révision ──────────────────────────────────────────────
async function loadReviewQueue() {
  const r = await fetch(`${API}/review/${sessionId}`);
  const data = await r.json();
  reviewQueue = data.blocks;
  reviewIdx   = 0;

  // Charger TOUS les blocs pour la liste latérale
  const sr = await fetch(`${API}/session/${sessionId}`);
  // On reconstruit une liste plate à partir du JSON d'export
  const jr = await fetch(`${API}/export/${sessionId}/json`);
  const jd = await jr.json();
  allBlocks = jd.pages.flatMap(p => p.blocks.map(b => ({...b, page_number: p.page_number})));

  renderBlockList();
  showPanel('editor');

  if (reviewQueue.length > 0) {
    loadBlock(reviewQueue[reviewIdx]);
  } else {
    // Tout validé automatiquement
    showDoneState();
  }
}

// ── Rendu liste de blocs ─────────────────────────────────────────────────────
function renderBlockList() {
  const list = document.getElementById('block-list');
  list.innerHTML = '';
  const flaggedCount = allBlocks.filter(b => b.flagged).length;
  document.getElementById('flag-count').textContent = `${flaggedCount} à réviser`;

  allBlocks.forEach(b => {
    const div = document.createElement('div');
    div.className = 'block-item' + (b.was_corrected ? ' corrected' : '');
    div.dataset.id = b.id;
    const conf = b.confidence || 0;
    const confClass = conf >= 0.85 ? 'conf-high' : conf >= 0.6 ? 'conf-medium' : 'conf-low';
    const icon = b.flagged ? '<span class="flag-icon">⚠</span>' : '<span class="ok-icon">✓</span>';
    div.innerHTML = `
      <span class="block-badge badge-${b.type}">${b.type}</span>
      <span class="block-id">p${b.page_number}_…</span>
      <div class="conf-bar"><div class="conf-bar-fill ${confClass}" style="width:${Math.round(conf*100)}%"></div></div>
      ${icon}`;
    // Si bloc est dans la review queue, le rendre cliquable
    const rq = reviewQueue.find(x => x.id === b.id);
    if (rq) div.onclick = () => { reviewIdx = reviewQueue.indexOf(rq); loadBlock(rq); };
    list.appendChild(div);
  });
}

// ── Charger un bloc dans l'éditeur ───────────────────────────────────────────
function loadBlock(block) {
  document.getElementById('block-type-tag').textContent = block.block_type || block.type;
  const conf = block.confidence || 0;
  const confEl = document.getElementById('conf-display');
  confEl.textContent = `confiance : ${(conf*100).toFixed(0)}%`;
  confEl.style.color = conf >= 0.85 ? 'var(--green)' : conf >= 0.6 ? 'var(--amber)' : 'var(--red)';

  // Image
  const img = document.getElementById('block-image');
  if (block.image_b64) {
    img.src = `data:image/png;base64,${block.image_b64}`;
  } else {
    img.src = '';
  }

  // OCR comparaison
  document.getElementById('mistral-out').textContent = block.raw_text_mistral || '—';
  document.getElementById('mathpix-out').textContent = block.raw_text_mathpix || '—';

  // Zone de correction
  document.getElementById('correction-area').value = block.merged_text || '';

  // Compteur
  document.getElementById('nav-counter').textContent =
    `${reviewIdx + 1} / ${reviewQueue.length}`;

  // Highlight dans la liste
  document.querySelectorAll('.block-item').forEach(el => el.classList.remove('active'));
  const activeItem = document.querySelector(`.block-item[data-id="${block.id}"]`);
  if (activeItem) { activeItem.classList.add('active'); activeItem.scrollIntoView({block:'nearest'}); }
}

// ── Valider avec correction ──────────────────────────────────────────────────
async function submitCorrection() {
  if (reviewIdx >= reviewQueue.length) return;
  const block = reviewQueue[reviewIdx];
  const correction = document.getElementById('correction-area').value.trim();
  if (!correction) return;

  await fetch(`${API}/correction`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, block_id: block.id, correction})
  });

  block.was_corrected = true;
  advanceReview();
}

// ── Accepter la fusion telle quelle ─────────────────────────────────────────
async function acceptMerged() {
  if (reviewIdx >= reviewQueue.length) return;
  const block = reviewQueue[reviewIdx];
  const merged = block.merged_text || document.getElementById('correction-area').value;

  await fetch(`${API}/correction`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, block_id: block.id, correction: merged})
  });

  advanceReview();
}

function skipBlock() { advanceReview(false); }

function advanceReview(markDone = true) {
  // Refresh liste
  if (markDone) {
    const li = document.querySelector(`.block-item[data-id="${reviewQueue[reviewIdx].id}"]`);
    if (li) li.classList.add('corrected');
  }

  reviewIdx++;
  if (reviewIdx < reviewQueue.length) {
    loadBlock(reviewQueue[reviewIdx]);
  } else {
    showDoneState();
  }
}

function showDoneState() {
  setStatus('done');
  document.getElementById('export-bar').classList.add('visible');
  document.getElementById('done-msg').textContent = '✓ Révision terminée — copie prête à l\'export';
  document.getElementById('editor-header').querySelector('h2').textContent = 'Révision terminée';
}

// ── Export ───────────────────────────────────────────────────────────────────
async function downloadExport(fmt) {
  window.open(`${API}/export/${sessionId}/${fmt}`, '_blank');
}

// ── Stats ────────────────────────────────────────────────────────────────────
function renderStats(stats) {
  const grid = document.getElementById('stats-grid');
  const items = [
    { num: stats.total_blocks,    lbl: 'blocs total',      cls: 'blue'  },
    { num: stats.auto_validated,  lbl: 'auto-validés',     cls: 'green' },
    { num: stats.flagged,         lbl: 'à réviser',        cls: 'amber' },
    { num: (stats.avg_confidence*100).toFixed(0)+'%', lbl: 'conf. moy.', cls: 'blue' },
  ];
  grid.innerHTML = items.map(i =>
    `<div class="stat-box">
      <div class="stat-num ${i.cls}">${i.num}</div>
      <div class="stat-lbl">${i.lbl}</div>
    </div>`
  ).join('');
}

// ── UI helpers ───────────────────────────────────────────────────────────────
function showPanel(which) {
  document.getElementById('upload-panel').style.display = which === 'upload' ? '' : 'none';
  document.getElementById('spinner').className           = which === 'spinner' ? 'visible' : '';
  document.getElementById('left-col').style.display      = which === 'editor' ? '' : 'none';
  document.getElementById('right-col').style.display     = which === 'editor' ? '' : 'none';
}

function setStatus(s) {
  const el = document.getElementById('status-badge');
  el.textContent = {'pending':'en attente','processing':'traitement…','review':'révision','done':'terminé','error':'erreur'}[s] || s;
  el.className = 'status-badge ' + s;  // pour l'id on garde la logique CSS
  el.id = 'status-badge';
  el.setAttribute('class', s);
  // Reconstruit avec la classe
  el.className = s;
  // Reset propre
  el.removeAttribute('class');
  el.id = 'status-badge';
  el.className = s;
}

function updateProgress(pct) {
  document.getElementById('progress-bar').style.width = (pct || 0) + '%';
}

function showError(msg) {
  showPanel('upload');
  setStatus('error');
  document.querySelector('#drop-zone p').innerHTML =
    `<strong style="color:var(--red)">Erreur</strong><br>${msg}`;
}
</script>
</body>
