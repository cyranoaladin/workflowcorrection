# =============================================================
#  CI/CD — workflowcorrection
#  • CI : lint + test backend + build frontend (on every push/PR)
#  • CD : deploy via SSH on push to main
# =============================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # ─── Backend: lint + tests ───────────────────────────────
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run database migrations
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          APP_ENV: test
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
        run: alembic upgrade head

      - name: Lint with Ruff
        working-directory: backend
        run: |
          pip install ruff==0.6.9
          ruff check .
          ruff format --check .

      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          APP_ENV: test
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          ADMIN_API_TOKEN: test-token-ci
          LOCAL_STORAGE_PATH: /tmp/storage
        run: |
          mkdir -p /tmp/storage
          pytest tests/ -v --tb=short

  # ─── Frontend: lint + build ──────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /correction
          NEXT_PUBLIC_API_BASE_URL: https://maths.labomaths.tn/correction/api
        run: npm run build

  # ─── Deploy to production ────────────────────────────────
  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/math-correction
            bash scripts/deploy_server.sh
