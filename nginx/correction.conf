# ============================================================
#  Nginx — blocs /correction/* pour maths.labomaths.tn
#
#  Ce fichier est un EXTRAIT à insérer dans le server{} block
#  HTTPS de maths.labomaths.tn (dans /etc/nginx/vhosts-enabled/).
#
#  PRÉREQUIS :
#    - htpasswd file : /etc/nginx/auth/correction.htpasswd
#    - docker-compose.labomaths.yml expose :
#        backend  → 127.0.0.1:8010
#        frontend → 127.0.0.1:3011
#    - ADMIN_API_TOKEN doit être inséré dans la directive
#      proxy_set_header Authorization ci-dessous.
#
#  DÉPLOIEMENT (à exécuter sur le serveur) :
#    1. Éditer /etc/nginx/vhosts-enabled/maths.labomaths.tn.conf
#    2. Remplacer les blocs /correction/* par le contenu ci-dessous
#    3. nginx -t && systemctl reload nginx
# ============================================================

# Static Next.js assets — NO auth (basePath=/correction génère /correction/_next/…)
location ^~ /correction/_next/ {
    rewrite ^/correction(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

# API health — NO auth (used for monitoring)
location /correction/api/health {
    proxy_pass http://127.0.0.1:8010/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# API routes — Basic Auth + Bearer token injection
location /correction/api/ {
    auth_basic "Correction";
    auth_basic_user_file /etc/nginx/auth/correction.htpasswd;

    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Inject ADMIN_API_TOKEN so backend trusts requests from Nginx
    proxy_set_header Authorization "Bearer <ADMIN_API_TOKEN>";

    client_max_body_size 50M;
    proxy_read_timeout 300s;
}

# Frontend app — Basic Auth
location /correction/ {
    auth_basic "Correction";
    auth_basic_user_file /etc/nginx/auth/correction.htpasswd;

    proxy_pass http://127.0.0.1:3011/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}
