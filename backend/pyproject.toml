[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",  # FastAPI Depends/Query defaults are intentional.
  "E501",  # Existing long prompt/test strings; formatter keeps safe wrapping.
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
  "e2e: end-to-end pipeline tests",
  "smoke: production smoke tests (require PUBLIC_API_BASE_URL)",
]
